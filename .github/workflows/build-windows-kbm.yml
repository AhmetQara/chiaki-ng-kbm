name: Build chiaki-ng KBM for Windows

# Builds on every push to the kbm branch, and publishes a GitHub release when a tag like kbm-v1.0.0 is pushed.
# Everything in the release is built here, from this repository's source.
on:
  push:
    branches: [ kbm ]
    tags: [ 'kbm-v*' ]
    # Text and picture changes don't need a 25-minute build
    paths-ignore: [ '**.md', 'docs/**', '.github/ISSUE_TEMPLATE/**', '.github/CODEOWNERS', '.github/funding.yml' ]
  pull_request:
    paths-ignore: [ '**.md', 'docs/**', '.github/ISSUE_TEMPLATE/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Windows x64 (msys2)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Disable autocrlf
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: git diffutils make unzip zip
          pacboy: >-
            ca-certificates:p
            cc:p
            cmake:p
            curl:p
            fast_float:p
            fftw:p
            json-c:p
            libevent:p
            lcms2:p
            libdovi:p
            meson:p
            miniupnpc:p
            gcc:p
            nasm:p
            ninja:p
            openssl:p
            opus:p
            pkgconf:p
            protobuf:p
            python:p
            python-psutil:p
            python-glad:p
            python-jinja:p
            python-pip:p
            python-protobuf:p
            qt6-base:p
            qt6-declarative:p
            qt6-svg:p
            shaderc:p
            speexdsp:p
            spirv-cross:p
            vulkan:p
            vulkan-headers:p

      - name: Build
        run: scripts/build-windows-kbm.sh "$(pwd)/dist/chiaki-ng-kbm"

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME//\//-}"
          cd dist
          zip -r "chiaki-ng-kbm-${VERSION}-win_x64.zip" chiaki-ng-kbm
          echo "PACKAGE=dist/chiaki-ng-kbm-${VERSION}-win_x64.zip" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v7
        with:
          name: chiaki-ng-kbm-win_x64
          path: ${{ env.PACKAGE }}
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/kbm-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "${{ env.PACKAGE }}" --title "chiaki-ng KBM ${{ github.ref_name }}" --notes "Download the zip below, extract it anywhere and run **KBM Launcher.exe**. Setup steps and the default keys are in the [README](https://github.com/${{ github.repository }}#readme). Built by GitHub Actions from this tag's source." --verify-tag
